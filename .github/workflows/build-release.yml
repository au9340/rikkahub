name: Build Release

# 推送到 master 自动出包；也可以在 Actions 里手动触发（可选发布带自定义 tag 的独立 Release）
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时发布为 GitHub Release（默认只上传构建产物）'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag（留空则覆盖更新 build-latest）'
        type: string
        required: false
        default: ''

# 连续推送时取消还没跑完的旧构建，省时间、也避免旧包覆盖新包
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 GitHub Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 签名密钥已硬编码在 app/build.gradle.kts 中（app/testkey_untrusted.jks），无需任何 Secret。
      # 运行编号作为构建编号传入，versionCode 每次递增，安装时可以直接覆盖，不用先卸载
      - name: Build release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --console=plain -PrikkaBuildNumber=${{ github.run_number }} 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 把 Kotlin / Gradle 的错误行转成 annotation，便于在 Actions 页面直接看到
            grep -aE "^e: |error: |FAILURE:|What went wrong|Caused by:|A problem occurred" gradle-build.log \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error title=GradleBuild::${line}"
                done
            exit "$status"
          fi

      # 确认产物确实用你的钥匙签过名（未签名会在此步直接失败）
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            echo ">>> $apk"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$apk"
            else
              keytool -printcert -jarfile "$apk"
            fi
          done

      # 构建产物随 workflow 一起下载，不需要发布 Release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # push 触发（或手动勾选 publish_release）时发布 Release。
      # 默认覆盖更新同一个 release（build-latest），下载地址固定不变，永远指向最新构建
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'build-latest' }}
          name: "Build #${{ github.run_number }}"
          prerelease: true
          body: |
            build #${{ github.run_number }}（commit `${{ github.sha }}`）

            versionCode = 191 + ${{ github.run_number }}，versionName 带 `+build${{ github.run_number }}` 后缀，
            版本号比上一次构建更大，可以直接覆盖安装。

            > ⚠️ 自建版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk
